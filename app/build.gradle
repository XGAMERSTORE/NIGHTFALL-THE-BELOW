}

android {
    namespace 'com.xgamerstore.nightfall'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xgamerstore.nightfall'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '1.6.1'
    }

    buildTypes {
        release {
            minifyEnabled false
